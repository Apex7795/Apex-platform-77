name: diagnostic-check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-check.yml'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: health/admin-token on apex-platform77-1
        run: curl -sS https://apex-platform77-1.onrender.com/api/health/admin-token || true

      - name: health/database-url on apex-platform77-1
        run: curl -sS https://apex-platform77-1.onrender.com/api/health/database-url || true

      - name: health/database-url on apex-platform77 (no dash-1)
        run: curl -sS https://apex-platform77.onrender.com/api/health/database-url || true

      - name: health/billing on apex-platform77-1
        run: curl -sS https://apex-platform77-1.onrender.com/api/health/billing || true

      - name: health/openai on apex-platform77-1
        run: curl -sS https://apex-platform77-1.onrender.com/api/health/openai || true

      - name: live admin/promote call on apex-platform77-1
        run: |
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://apex-platform77-1.onrender.com/api/admin/promote?token=d8185a0bd3a2ef4a960b8852ed3f8670fcc34dffa0841037a3d525840141dc38&email=apex7795@proton.me" || true

      - name: live tenant-acquisition prospecting run for Sacramento, CA
        run: |
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer d8185a0bd3a2ef4a960b8852ed3f8670fcc34dffa0841037a3d525840141dc38" \
            -H "Content-Type: application/json" \
            -d '{"city": "Sacramento, CA"}' \
            "https://apex-platform77-1.onrender.com/api/prospects/discover" || true

      - name: health/db on apex-platform77-1
        run: curl -sS https://apex-platform77-1.onrender.com/api/health/db || true

      - name: health/db on apex-platform77 (no dash-1)
        run: curl -sS https://apex-platform77.onrender.com/api/health/db || true

      - name: health/prospecting on apex-platform77-1
        run: curl -sS https://apex-platform77-1.onrender.com/api/health/prospecting || true

      - name: health/quotes on apex-platform77-1
        run: curl -sS https://apex-platform77-1.onrender.com/api/health/quotes || true

      - name: provision-tracking-number route exists (no token -- expect 401, not 404, spends no money)
        run: |
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://apex-platform77-1.onrender.com/api/admin/provision-tracking-number" || true
